# This repo's own published version. The release workflow overrides it with
# `-Pversion=<tag without the leading v>`.
version=0.1.0-SNAPSHOT

# The lightbatis core version these modules compile and depend on. A separate
# knob from `version`: the Spring integration can ship a fix without the core
# moving, and can adopt a core release without one of its own. During local
# development the includeBuild in settings.gradle.kts substitutes the projects
# and this value is not resolved at all.
lightbatisVersion=0.1.0-SNAPSHOT
